<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Brimbank Spatial Explorer — Victoria</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>

  <style>
    /* ============================================================
       TOKENS
    ============================================================ */
    :root {
      --bg-deep:      #050810;
      --bg-surface:   #0a0f18;
      --bg-elevated:  #10161f;
      --bg-hover:     #171f2e;
      --border:       #1c2a3a;
      --border-hi:    #243650;
      --accent:       #f59e0b;
      --accent-dim:   #92610a;
      --cyan:         #22d3ee;
      --cyan-dim:     #0e7490;
      --text-hi:      #f0f4f8;
      --text-mid:     #8fa4ba;
      --text-lo:      #3d5268;
      --ok:           #22c55e;
      --warn:         #f59e0b;
      --err:          #ef4444;
      --inactive:     #2a3a4a;
      --sidebar-w:    272px;
      --toolbar-h:    46px;
      --statusbar-h:  30px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg-deep);
      font-family: 'Rajdhani', sans-serif;
      color: var(--text-hi);
    }

    /* ============================================================
       MAP
    ============================================================ */
    #map {
      position: absolute;
      top: var(--toolbar-h);
      bottom: var(--statusbar-h);
      left: 0; right: 0;
      z-index: 1;
      background: var(--bg-deep);
    }

    /* ============================================================
       TOOLBAR
    ============================================================ */
    #toolbar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: var(--toolbar-h);
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 10px;
      z-index: 1000;
    }

    .app-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--accent);
      padding: 0 6px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .app-title em { color: var(--text-mid); font-style: normal; font-weight: 400; }

    .tsep { width: 1px; height: 22px; background: var(--border); margin: 0 3px; flex-shrink: 0; }

    .tbtn {
      height: 32px;
      padding: 0 11px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--text-mid);
      font-family: 'Rajdhani', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.12s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .tbtn:hover  { background: var(--bg-hover); border-color: var(--border-hi); color: var(--text-hi); }
    .tbtn.active { background: var(--accent); border-color: var(--accent); color: #000; }
    .tbtn svg    { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

    #search-wrap {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 4px;
      position: relative;
      max-width: 340px;
      flex: 1;
    }
    #search-input {
      flex: 1;
      height: 32px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 0 10px;
      color: var(--text-hi);
      font-family: 'Rajdhani', sans-serif;
      font-size: 13px;
      font-weight: 500;
      outline: none;
      transition: border-color 0.15s;
      min-width: 0;
    }
    #search-input:focus { border-color: var(--cyan); }
    #search-input::placeholder { color: var(--text-lo); }
    #search-go {
      height: 32px;
      padding: 0 13px;
      background: var(--cyan-dim);
      border: none;
      border-radius: 3px;
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: background 0.12s;
      flex-shrink: 0;
    }
    #search-go:hover { background: var(--cyan); color: #000; }
    #search-results {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 56px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-hi);
      border-radius: 3px;
      z-index: 3000;
      display: none;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .sr-item {
      padding: 8px 11px;
      font-size: 12px;
      color: var(--text-mid);
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
      line-height: 1.35;
    }
    .sr-item:last-child { border-bottom: none; }
    .sr-item:hover { background: var(--bg-hover); color: var(--text-hi); }
    .sr-item strong { display: block; color: var(--text-hi); margin-bottom: 1px; font-size: 13px; }

    /* ============================================================
       SIDEBAR
    ============================================================ */
    #sidebar {
      position: absolute;
      top: var(--toolbar-h);
      bottom: var(--statusbar-h);
      left: 0;
      width: var(--sidebar-w);
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
      z-index: 500;
      display: flex;
      flex-direction: column;
      transform: translateX(calc(-1 * var(--sidebar-w)));
      transition: transform 0.22s cubic-bezier(0.4,0,0.2,1);
    }
    #sidebar.open { transform: translateX(0); }

    #sb-head {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    #sb-head h2 {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--text-lo);
    }
    #sb-close {
      background: none;
      border: none;
      color: var(--text-lo);
      cursor: pointer;
      font-size: 17px;
      line-height: 1;
      transition: color 0.12s;
    }
    #sb-close:hover { color: var(--text-hi); }

    #layer-panel {
      flex: 1;
      overflow-y: auto;
      padding: 6px 0 12px;
    }
    #layer-panel::-webkit-scrollbar { width: 3px; }
    #layer-panel::-webkit-scrollbar-track { background: transparent; }
    #layer-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* Group */
    .lg { margin-bottom: 1px; }

    .lg-head {
      padding: 7px 14px 5px;
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      user-select: none;
      transition: background 0.1s;
    }
    .lg-head:hover { background: var(--bg-hover); }
    .lg-chev {
      font-size: 7px;
      color: var(--text-lo);
      transition: transform 0.18s;
      flex-shrink: 0;
      line-height: 1;
    }
    .lg-head.open .lg-chev { transform: rotate(90deg); }
    .lg-name {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: var(--text-lo);
      text-transform: uppercase;
      flex: 1;
    }
    .lg-count {
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      color: var(--text-lo);
    }

    .lg-body { display: none; }
    .lg-body.open { display: block; }

    /* Layer row */
    .li {
      padding: 6px 14px 6px 26px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .li:hover { background: var(--bg-hover); }
    .li-cb {
      width: 13px; height: 13px;
      accent-color: var(--accent);
      flex-shrink: 0;
      cursor: pointer;
    }
    .li-info { flex: 1; min-width: 0; }
    .li-name {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-mid);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.12s;
    }
    .li.is-on .li-name { color: var(--text-hi); }
    .li-zoom {
      font-size: 9px;
      color: var(--text-lo);
      font-family: 'Share Tech Mono', monospace;
      margin-top: 1px;
    }
    .sdot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--inactive);
      flex-shrink: 0;
      transition: background 0.3s, box-shadow 0.3s;
    }
    .sdot.ok      { background: var(--ok); box-shadow: 0 0 5px rgba(34,197,94,0.5); }
    .sdot.loading { background: var(--warn); animation: pulse 1.2s infinite; }
    .sdot.error   { background: var(--err); }

    @keyframes pulse {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.4; }
    }

    /* Opacity row */
    .li-op {
      display: none;
      padding: 3px 14px 7px 39px;
      align-items: center;
      gap: 8px;
    }
    .li-op.show { display: flex; }
    .op-slider {
      flex: 1;
      height: 3px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .op-val {
      font-size: 9px;
      color: var(--text-lo);
      font-family: 'Share Tech Mono', monospace;
      width: 26px;
      text-align: right;
    }

    /* ============================================================
       STATUS BAR
    ============================================================ */
    #statusbar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: var(--statusbar-h);
      background: var(--bg-surface);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 12px;
      z-index: 1000;
    }
    .si {
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      white-space: nowrap;
    }
    .si .lbl { color: var(--text-lo); font-size: 8.5px; letter-spacing: 0.1em; }
    .si .val { color: var(--cyan); }
    .ssep { width: 1px; height: 14px; background: var(--border); flex-shrink: 0; }

    #measure-si { display: none; }
    #measure-si .val { color: var(--accent); }

    /* ============================================================
       WATERMARK
    ============================================================ */
    #watermark {
      position: absolute;
      bottom: calc(var(--statusbar-h) + 10px);
      right: 14px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.15);
      z-index: 400;
      pointer-events: none;
      user-select: none;
    }

    /* ============================================================
       INFO PANEL
    ============================================================ */
    #info-panel {
      position: absolute;
      top: calc(var(--toolbar-h) + 10px);
      right: 10px;
      width: 230px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-hi);
      border-radius: 4px;
      z-index: 700;
      display: none;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }
    #info-panel.show { display: block; }
    #ip-head {
      padding: 8px 11px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #ip-head span {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: var(--text-lo);
    }
    #ip-close {
      background: none;
      border: none;
      color: var(--text-lo);
      cursor: pointer;
      font-size: 14px;
      transition: color 0.12s;
    }
    #ip-close:hover { color: var(--text-hi); }
    #ip-body {
      padding: 8px 11px;
      max-height: 280px;
      overflow-y: auto;
    }
    .ip-row {
      display: flex;
      gap: 6px;
      padding: 3px 0;
      border-bottom: 1px solid var(--border);
    }
    .ip-row:last-child { border-bottom: none; }
    .ip-k {
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      color: var(--text-lo);
      width: 80px;
      flex-shrink: 0;
      padding-top: 1px;
      word-break: break-all;
    }
    .ip-v {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      color: var(--text-hi);
      word-break: break-all;
    }

    /* ============================================================
       LOADING BAR
    ============================================================ */
    #loadbar {
      position: absolute;
      top: var(--toolbar-h);
      left: 0; right: 0;
      height: 2px;
      z-index: 999;
      pointer-events: none;
    }
    #loadbar.go::after {
      content: '';
      display: block;
      height: 100%;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
      animation: lb 1.6s ease-in-out infinite;
    }
    @keyframes lb {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }

    /* ============================================================
       LEAFLET OVERRIDES
    ============================================================ */
    .leaflet-control-zoom {
      border: 1px solid var(--border) !important;
      border-radius: 3px !important;
      overflow: hidden;
    }
    .leaflet-control-zoom a {
      background: var(--bg-surface) !important;
      color: var(--text-mid) !important;
      border-color: var(--border) !important;
      font-size: 15px !important;
      line-height: 26px !important;
      width: 26px !important;
      height: 26px !important;
    }
    .leaflet-control-zoom a:hover { background: var(--bg-hover) !important; color: var(--text-hi) !important; }
    .leaflet-control-attribution {
      background: rgba(5,8,16,0.85) !important;
      color: var(--text-lo) !important;
      font-size: 8.5px !important;
    }
    .leaflet-control-attribution a { color: var(--text-lo) !important; }
    .leaflet-control-scale-line {
      border: 1px solid var(--cyan) !important;
      border-top: none !important;
      background: rgba(5,8,16,0.75) !important;
      color: var(--cyan) !important;
      font-family: 'Share Tech Mono', monospace !important;
      font-size: 9px !important;
    }
    /* Hide default Leaflet.draw toolbar — we use our own buttons */
    .leaflet-draw-toolbar { display: none !important; }
    .leaflet-draw-actions  { display: none !important; }

    .leaflet-popup-content-wrapper {
      background: var(--bg-elevated) !important;
      border: 1px solid var(--accent) !important;
      border-radius: 4px !important;
      color: var(--accent) !important;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5) !important;
    }
    .leaflet-popup-content {
      font-family: 'Share Tech Mono', monospace !important;
      font-size: 11px !important;
      margin: 8px 10px !important;
    }
    .leaflet-popup-tip { background: var(--bg-elevated) !important; }
  </style>
</head>
<body>

  <!-- Loading bar -->
  <div id="loadbar"></div>

  <!-- ══ TOOLBAR ══════════════════════════════════════════════ -->
  <div id="toolbar">
    <div class="app-title">BRIMBANK <em>SPATIAL</em></div>
    <div class="tsep"></div>

    <button class="tbtn" id="btn-layers">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4" rx="1"/><rect x="3" y="10" width="18" height="4" rx="1"/><rect x="3" y="16" width="18" height="4" rx="1"/></svg>
      LAYERS
    </button>

    <button class="tbtn" id="btn-measure">
      <svg viewBox="0 0 24 24"><line x1="4" y1="20" x2="20" y2="4"/><line x1="9" y1="20" x2="9" y2="16"/><line x1="14" y1="20" x2="14" y2="14"/><line x1="4" y1="11" x2="8" y2="11"/><line x1="4" y1="6" x2="8" y2="6"/></svg>
      MEASURE
    </button>

    <button class="tbtn" id="btn-area">
      <svg viewBox="0 0 24 24"><polygon points="3,20 12,4 21,20"/><line x1="7" y1="20" x2="7" y2="16"/><line x1="17" y1="20" x2="17" y2="16"/></svg>
      AREA
    </button>

    <button class="tbtn" id="btn-clear">
      <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
      CLEAR
    </button>

    <!-- spacer -->
    <div style="flex:1; min-width:4px;"></div>

    <!-- Search -->
    <div id="search-wrap">
      <input id="search-input" type="text" placeholder="Search Victoria…" autocomplete="off" spellcheck="false"/>
      <button id="search-go">GO</button>
      <div id="search-results"></div>
    </div>
  </div>

  <!-- ══ SIDEBAR ══════════════════════════════════════════════ -->
  <div id="sidebar">
    <div id="sb-head">
      <h2>DATA LAYERS</h2>
      <button id="sb-close">×</button>
    </div>
    <div id="layer-panel"></div>
  </div>

  <!-- ══ MAP ══════════════════════════════════════════════════ -->
  <div id="map"></div>

  <!-- ══ INFO PANEL ═══════════════════════════════════════════ -->
  <div id="info-panel">
    <div id="ip-head">
      <span>FEATURE INFO</span>
      <button id="ip-close">×</button>
    </div>
    <div id="ip-body"></div>
  </div>

  <!-- ══ STATUS BAR ═══════════════════════════════════════════ -->
  <div id="statusbar">
    <div class="si">
      <span class="lbl">MGA55</span>
      <span class="val" id="s-e">——— E</span>
      <span class="val" id="s-n">——— N</span>
    </div>
    <div class="ssep"></div>
    <div class="si">
      <span class="lbl">WGS84</span>
      <span class="val" id="s-lat">——</span>
      <span class="val" id="s-lng">——</span>
    </div>
    <div class="ssep"></div>
    <div class="si">
      <span class="lbl">ZOOM</span>
      <span class="val" id="s-zoom">—</span>
    </div>
    <div class="ssep" id="msep" style="display:none"></div>
    <div class="si" id="measure-si">
      <span class="lbl" id="m-label">DIST</span>
      <span class="val" id="s-measure">—</span>
    </div>
  </div>

  <!-- ══ WATERMARK ════════════════════════════════════════════ -->
  <div id="watermark">brimbankspatial.com.au</div>

  <!-- ══ SCRIPTS ══════════════════════════════════════════════ -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

  <script>
  'use strict';

  /* ============================================================
     PROJECTIONS — MGA Zone 55 / GDA94 (covers all of Victoria)
  ============================================================ */
  proj4.defs('EPSG:28355',
    '+proj=utm +zone=55 +south +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs'
  );

  function toMGA55(lat, lng) {
    try {
      const [e, n] = proj4('EPSG:4326', 'EPSG:28355', [lng, lat]);
      return {
        e: Math.round(e).toLocaleString('en-AU') + ' E',
        n: Math.round(n).toLocaleString('en-AU') + ' N'
      };
    } catch { return { e: '— E', n: '— N' }; }
  }

  /* ============================================================
     LAYER CONFIGURATION
     ─────────────────────────────────────────────────────────
     To add a layer:    add one object to the array.
     To remove a layer: delete the object.
     To reorder:        move the object.
     All WMS requests use dynamic viewport bbox automatically.
  ============================================================ */

  const DV  = 'https://services.land.vic.gov.au/catalogue/publicproxy/guest/dv_geoserver/wms';

  const LAYER_CONFIG = [

    // ── BASEMAP ───────────────────────────────────────────────
    {
      id: 'aerial', name: 'Aerial Imagery', group: 'Basemap',
      type: 'tile',
      url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      attribution: '© Esri World Imagery',
      opacity: 1, defaultOn: false, minZoom: 1,
      desc: 'Esri World Imagery satellite basemap',
    },

    // ── CADASTRE ─────────────────────────────────────────────
    {
      id: 'parcels', name: 'Land Parcels', group: 'Cadastre',
      type: 'wms', url: DV, layers: 'VMPROPERT:PARCEL',
      opacity: 0.8, defaultOn: true, minZoom: 14,
      desc: 'Property lot boundaries — Vicmap Property',
    },
    {
      id: 'addresses', name: 'Address Points', group: 'Cadastre',
      type: 'wms', url: DV, layers: 'VMADD:ADDRESS',
      opacity: 0.9, defaultOn: false, minZoom: 16,
      desc: 'Addressable property points — Vicmap Address',
    },
    {
      id: 'buildings', name: 'Building Footprints', group: 'Cadastre',
      type: 'wms', url: DV, layers: 'VMBLDG:BUILDING',
      opacity: 0.7, defaultOn: false, minZoom: 15,
      desc: 'Building outlines — Vicmap Buildings',
    },

    // ── PLANNING ─────────────────────────────────────────────
    {
      id: 'planning_zones', name: 'Planning Zones', group: 'Planning',
      type: 'wms', url: DV, layers: 'VMPLAN:PLANNING_ZONE_POLYGON',
      opacity: 0.6, defaultOn: false, minZoom: 12,
      desc: 'Victorian planning zones — Vicmap Planning',
    },
    {
      id: 'heritage', name: 'Heritage Overlays', group: 'Planning',
      type: 'wms', url: DV, layers: 'VMPLAN:HERITAGE_OVERLAY_POLYGON',
      opacity: 0.7, defaultOn: false, minZoom: 12,
      desc: 'Heritage overlay areas — Vicmap Planning',
    },
    {
      id: 'bushfire', name: 'Bushfire Prone Areas', group: 'Planning',
      type: 'wms', url: DV, layers: 'VMPLAN:BUSHFIRE_PRONE_AREA',
      opacity: 0.6, defaultOn: false, minZoom: 10,
      desc: 'CFA Bushfire Prone Areas — DataVic',
    },

    // ── ADMINISTRATIVE ────────────────────────────────────────
    {
      id: 'suburbs', name: 'Suburb Boundaries', group: 'Administrative',
      type: 'wms', url: DV, layers: 'VMADMIN:LOCALITY_POLYGON',
      opacity: 0.65, defaultOn: true, minZoom: 10,
      desc: 'Suburb and locality boundaries — Vicmap Admin',
    },
    {
      id: 'lga', name: 'LGA Boundaries', group: 'Administrative',
      type: 'wms', url: DV, layers: 'VMADMIN:LGA_POLYGON',
      opacity: 0.7, defaultOn: false, minZoom: 8,
      desc: 'Local Government Areas incl. Brimbank — Vicmap Admin',
    },
    {
      id: 'crown_land', name: 'Crown & Public Land', group: 'Administrative',
      type: 'wms', url: DV, layers: 'VMPLAN:PUBLIC_LAND_POLYGON',
      opacity: 0.5, defaultOn: false, minZoom: 11,
      desc: 'Crown and public land tenure — DataVic',
    },

    // ── WATER ─────────────────────────────────────────────────
    {
      id: 'waterways', name: 'Waterways & Rivers', group: 'Water',
      type: 'wms', url: DV, layers: 'VMWATER:WATERCOURSE_CENTRELINE',
      opacity: 0.9, defaultOn: false, minZoom: 10,
      desc: 'Rivers, creeks and streams — Vicmap Hydro',
    },
    {
      id: 'water_bodies', name: 'Water Bodies', group: 'Water',
      type: 'wms', url: DV, layers: 'VMWATER:WATER_AREA_POLYGON',
      opacity: 0.8, defaultOn: false, minZoom: 10,
      desc: 'Lakes, wetlands, reservoirs — Vicmap Hydro',
    },
    {
      id: 'flood', name: 'Flood Extent', group: 'Water',
      type: 'wms',
      url: 'https://opendata.deeca.vic.gov.au/server/rest/services/FloodMapping/MapServer/WMSServer',
      layers: '0',
      opacity: 0.55, defaultOn: false, minZoom: 10,
      desc: 'Flood extent mapping — DEECA (endpoint TBC)',
    },
    {
      id: 'drainage', name: 'Drainage Catchments', group: 'Water',
      type: 'wms', url: DV, layers: 'VMWATER:DRAINAGE_AREA_POLYGON',
      opacity: 0.5, defaultOn: false, minZoom: 10,
      desc: 'Drainage catchment boundaries — Vicmap Hydro',
    },

    // ── ENVIRONMENT ───────────────────────────────────────────
    {
      id: 'native_veg', name: 'Native Vegetation', group: 'Environment',
      type: 'wms', url: DV, layers: 'DEECA:NATIVE_VEGETATION',
      opacity: 0.6, defaultOn: false, minZoom: 11,
      desc: 'Native vegetation extent — DEECA (layer name TBC)',
    },

    // ── TRANSPORT ─────────────────────────────────────────────
    {
      id: 'roads', name: 'Roads', group: 'Transport',
      type: 'wms', url: DV, layers: 'VMTRANS:ROAD',
      opacity: 0.7, defaultOn: false, minZoom: 12,
      desc: 'Road network — Vicmap Transport',
    },
    {
      id: 'pt_stops', name: 'PT Stops', group: 'Transport',
      type: 'wms', url: DV, layers: 'VMTRANS:STOP',
      opacity: 0.9, defaultOn: false, minZoom: 13,
      desc: 'Train, tram & bus stops — Vicmap Transport / PTV',
    },
    {
      id: 'bike_paths', name: 'Bike Paths & Trails', group: 'Transport',
      type: 'wms', url: DV, layers: 'VMTRANS:TRACK',
      opacity: 0.8, defaultOn: false, minZoom: 12,
      desc: 'Cycling infrastructure — Vicmap Transport',
    },

    // ── TERRAIN ───────────────────────────────────────────────
    {
      id: 'contours', name: 'Contours / Elevation', group: 'Terrain',
      type: 'wms', url: DV, layers: 'VMELEV:CONTOUR',
      opacity: 0.7, defaultOn: false, minZoom: 13,
      desc: 'Elevation contours — Vicmap Elevation',
    },

  ]; // END LAYER_CONFIG

  /* ============================================================
     MAP INIT — centred on Keilor East
  ============================================================ */
  const map = L.map('map', {
    center: [-37.7258, 144.8738],
    zoom: 15,
    zoomControl: true,
  });

  // Dark basemap
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap contributors © CARTO',
    subdomains: 'abcd',
    maxZoom: 21,
  }).addTo(map);

  // Scale bar
  L.control.scale({ imperial: false, position: 'bottomleft', maxWidth: 200 }).addTo(map);

  /* ============================================================
     LAYER ENGINE
  ============================================================ */
  const instances = {};     // id → Leaflet layer
  const statuses  = {};     // id → 'inactive'|'loading'|'ok'|'error'

  function buildLayer(cfg) {
    if (cfg.type === 'tile') {
      return L.tileLayer(cfg.url, {
        attribution: cfg.attribution || '',
        opacity: cfg.opacity || 1,
        maxZoom: 21,
      });
    }
    if (cfg.type === 'wms') {
      return L.tileLayer.wms(cfg.url, {
        layers:      cfg.layers,
        format:      'image/png',
        transparent: true,
        opacity:     cfg.opacity || 0.8,
        attribution: '© State of Victoria (DataVic)',
        version:     '1.1.1',
        // Leaflet uses viewport bbox dynamically — scales to all of VIC ✓
      });
    }
    return null;
  }

  function setStatus(id, s) {
    statuses[id] = s;
    const dot = document.querySelector(`.sdot[data-id="${id}"]`);
    if (dot) { dot.className = `sdot ${s}`; dot.title = s.toUpperCase(); }
  }

  function toggleLayer(cfg, on) {
    let layer = instances[cfg.id];
    if (on) {
      if (!layer) {
        layer = buildLayer(cfg);
        if (!layer) return;
        instances[cfg.id] = layer;
        setStatus(cfg.id, 'loading');
        layer.on('tileload',  () => { if (statuses[cfg.id] !== 'ok') setStatus(cfg.id, 'ok'); });
        layer.on('tileerror', () => { setStatus(cfg.id, 'error'); });
        layer.on('loading',   () => { if (statuses[cfg.id] !== 'ok') setStatus(cfg.id, 'loading'); });
      }
      map.addLayer(layer);
      if (statuses[cfg.id] !== 'ok') setStatus(cfg.id, 'loading');
    } else {
      if (layer) map.removeLayer(layer);
      setStatus(cfg.id, 'inactive');
    }
  }

  /* ============================================================
     SIDEBAR — BUILD LAYER PANEL
  ============================================================ */
  (function buildPanel() {
    const panel = document.getElementById('layer-panel');
    const groups = {};
    LAYER_CONFIG.forEach(c => { (groups[c.group] = groups[c.group] || []).push(c); });

    let firstTwo = 0;
    Object.entries(groups).forEach(([gname, layers]) => {
      const div = document.createElement('div');
      div.className = 'lg';

      const head = document.createElement('div');
      head.className = 'lg-head';
      head.innerHTML =
        `<span class="lg-chev">▶</span>` +
        `<span class="lg-name">${gname}</span>` +
        `<span class="lg-count">${layers.length}</span>`;

      const body = document.createElement('div');
      body.className = 'lg-body';

      head.addEventListener('click', () => {
        head.classList.toggle('open');
        body.classList.toggle('open');
      });

      layers.forEach(cfg => {
        statuses[cfg.id] = 'inactive';

        const row = document.createElement('div');
        row.className = 'li' + (cfg.defaultOn ? ' is-on' : '');
        row.dataset.id = cfg.id;
        row.innerHTML =
          `<input type="checkbox" class="li-cb" id="cb-${cfg.id}" ${cfg.defaultOn ? 'checked' : ''} data-id="${cfg.id}"/>` +
          `<div class="li-info">` +
            `<div class="li-name" title="${cfg.desc}">${cfg.name}</div>` +
            (cfg.minZoom > 1 ? `<div class="li-zoom">zoom ≥ ${cfg.minZoom}</div>` : '') +
          `</div>` +
          `<div class="sdot" data-id="${cfg.id}" title="INACTIVE"></div>`;

        const opRow = document.createElement('div');
        opRow.className = 'li-op' + (cfg.defaultOn ? ' show' : '');
        opRow.dataset.id = cfg.id;
        const pct = Math.round((cfg.opacity || 0.8) * 100);
        opRow.innerHTML =
          `<input type="range" class="op-slider" min="0" max="1" step="0.05" value="${cfg.opacity || 0.8}" data-id="${cfg.id}"/>` +
          `<span class="op-val" data-id="${cfg.id}">${pct}%</span>`;

        // Checkbox toggle
        row.querySelector('.li-cb').addEventListener('change', e => {
          const on = e.target.checked;
          row.classList.toggle('is-on', on);
          opRow.classList.toggle('show', on);
          toggleLayer(cfg, on);
        });

        // Opacity
        opRow.querySelector('.op-slider').addEventListener('input', e => {
          const v = parseFloat(e.target.value);
          opRow.querySelector('.op-val').textContent = Math.round(v * 100) + '%';
          if (instances[cfg.id]) instances[cfg.id].setOpacity(v);
        });

        body.appendChild(row);
        body.appendChild(opRow);
        if (cfg.defaultOn) toggleLayer(cfg, true);
      });

      div.appendChild(head);
      div.appendChild(body);
      panel.appendChild(div);

      // Auto-open Basemap + Cadastre
      if (firstTwo < 2) {
        head.classList.add('open');
        body.classList.add('open');
        firstTwo++;
      }
    });
  })();

  /* ============================================================
     SIDEBAR TOGGLE
  ============================================================ */
  const sidebar = document.getElementById('sidebar');
  const btnLayers = document.getElementById('btn-layers');

  btnLayers.addEventListener('click', () => {
    sidebar.classList.toggle('open');
    btnLayers.classList.toggle('active', sidebar.classList.contains('open'));
  });
  document.getElementById('sb-close').addEventListener('click', () => {
    sidebar.classList.remove('open');
    btnLayers.classList.remove('active');
  });

  /* ============================================================
     COORDINATES — live MGA55 + WGS84 on mousemove
  ============================================================ */
  const sE    = document.getElementById('s-e');
  const sN    = document.getElementById('s-n');
  const sLat  = document.getElementById('s-lat');
  const sLng  = document.getElementById('s-lng');
  const sZoom = document.getElementById('s-zoom');

  map.on('mousemove', ({ latlng: { lat, lng } }) => {
    const m = toMGA55(lat, lng);
    sE.textContent   = m.e;
    sN.textContent   = m.n;
    sLat.textContent = lat.toFixed(5) + '°';
    sLng.textContent = lng.toFixed(5) + '°';
  });

  function updateZoom() { sZoom.textContent = map.getZoom(); }
  map.on('zoom', updateZoom);
  updateZoom();

  /* ============================================================
     LOADING BAR — fires on map tile loading
  ============================================================ */
  const loadbar = document.getElementById('loadbar');
  map.on('loading', () => loadbar.classList.add('go'));
  map.on('load',    () => loadbar.classList.remove('go'));

  /* ============================================================
     MEASURE TOOLS — Leaflet.draw (toolbar hidden, custom buttons)
  ============================================================ */
  const drawn = new L.FeatureGroup().addTo(map);

  // Add draw control to map (needed for event system) but toolbar hidden via CSS
  const drawCtrl = new L.Control.Draw({
    draw: {
      polyline: { shapeOptions: { color: '#f59e0b', weight: 2.5 }, metric: true },
      polygon:  { shapeOptions: { color: '#22d3ee', weight: 2.5, fillOpacity: 0.12 }, metric: true, showArea: true },
      rectangle: false, circle: false, marker: false, circlemarker: false,
    },
    edit: { featureGroup: drawn, remove: true, edit: false },
  });
  map.addControl(drawCtrl);

  let activeHandler = null;
  const sMeasure = document.getElementById('s-measure');
  const mLabel   = document.getElementById('m-label');
  const measureSi = document.getElementById('measure-si');
  const msep      = document.getElementById('msep');

  function showMeasure(label, val) {
    mLabel.textContent = label;
    sMeasure.textContent = val;
    measureSi.style.display = 'flex';
    msep.style.display = 'block';
  }

  function stopHandler() {
    if (activeHandler) { try { activeHandler.disable(); } catch(e){} activeHandler = null; }
    document.getElementById('btn-measure').classList.remove('active');
    document.getElementById('btn-area').classList.remove('active');
  }

  document.getElementById('btn-measure').addEventListener('click', () => {
    const btn = document.getElementById('btn-measure');
    if (btn.classList.contains('active')) { stopHandler(); return; }
    stopHandler();
    activeHandler = new L.Draw.Polyline(map, drawCtrl.options.draw.polyline);
    activeHandler.enable();
    btn.classList.add('active');
  });

  document.getElementById('btn-area').addEventListener('click', () => {
    const btn = document.getElementById('btn-area');
    if (btn.classList.contains('active')) { stopHandler(); return; }
    stopHandler();
    activeHandler = new L.Draw.Polygon(map, drawCtrl.options.draw.polygon);
    activeHandler.enable();
    btn.classList.add('active');
  });

  document.getElementById('btn-clear').addEventListener('click', () => {
    drawn.clearLayers();
    stopHandler();
    measureSi.style.display = 'none';
    msep.style.display = 'none';
  });

  map.on(L.Draw.Event.CREATED, e => {
    drawn.addLayer(e.layer);
    stopHandler();

    if (e.layerType === 'polyline') {
      const pts = e.layer.getLatLngs();
      let d = 0;
      for (let i = 1; i < pts.length; i++) d += pts[i-1].distanceTo(pts[i]);
      const lbl = d >= 1000 ? (d/1000).toFixed(3) + ' km' : d.toFixed(1) + ' m';
      showMeasure('DIST', lbl);
      e.layer.bindPopup(`📏 ${lbl}`).openPopup();
    }

    if (e.layerType === 'polygon') {
      const a = L.GeometryUtil.geodesicArea(e.layer.getLatLngs()[0]);
      const lbl = a >= 10000 ? (a/10000).toFixed(3) + ' ha' : a.toFixed(1) + ' m²';
      showMeasure('AREA', lbl);
      e.layer.bindPopup(`⬛ ${lbl}`).openPopup();
    }
  });

  /* ============================================================
     ADDRESS SEARCH — Nominatim (OSM geocoder, Victoria)
  ============================================================ */
  const searchInput   = document.getElementById('search-input');
  const searchResults = document.getElementById('search-results');
  let searchMarker = null;

  async function doSearch() {
    const q = searchInput.value.trim();
    if (!q) return;
    searchResults.style.display = 'block';
    searchResults.innerHTML = '<div class="sr-item">Searching…</div>';

    try {
      const url =
        `https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=6` +
        `&q=${encodeURIComponent(q + ', Victoria, Australia')}`;
      const res  = await fetch(url, { headers: { 'Accept-Language': 'en-AU', 'User-Agent': 'BrimankSpatialExplorer/1.0' } });
      const data = await res.json();

      if (!data.length) {
        searchResults.innerHTML = '<div class="sr-item">No results — try a street, suburb or place name</div>';
        return;
      }

      searchResults.innerHTML = '';
      data.forEach(item => {
        const parts = item.display_name.split(',').map(s => s.trim());
        const title = parts.slice(0, 2).join(', ');
        const sub   = parts.slice(2, 4).join(', ');
        const el = document.createElement('div');
        el.className = 'sr-item';
        el.innerHTML = `<strong>${title}</strong>${sub}`;
        el.addEventListener('click', () => {
          const lat = parseFloat(item.lat), lng = parseFloat(item.lon);
          map.setView([lat, lng], 17);
          if (searchMarker) map.removeLayer(searchMarker);
          searchMarker = L.circleMarker([lat, lng], {
            radius: 7, color: '#f59e0b', fillColor: '#f59e0b', fillOpacity: 0.55, weight: 2,
          }).addTo(map).bindPopup(`<div style="font-size:11px;color:#f59e0b">${title}</div>`).openPopup();
          searchResults.style.display = 'none';
          searchInput.value = title;
        });
        searchResults.appendChild(el);
      });
    } catch {
      searchResults.innerHTML = '<div class="sr-item">Search unavailable — check connection</div>';
    }
  }

  document.getElementById('search-go').addEventListener('click', doSearch);
  searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
  document.addEventListener('click', e => {
    if (!e.target.closest('#search-wrap')) searchResults.style.display = 'none';
  });

  /* ============================================================
     WMS GETFEATUREINFO — click any active WMS layer
     (best-effort: silently fails if server blocks CORS on GFI)
  ============================================================ */
  const ipPanel = document.getElementById('info-panel');
  const ipBody  = document.getElementById('ip-body');

  document.getElementById('ip-close').addEventListener('click', () => ipPanel.classList.remove('show'));

  map.on('click', async e => {
    // Find topmost visible WMS layer
    const active = LAYER_CONFIG.filter(c =>
      c.type === 'wms' && instances[c.id] && map.hasLayer(instances[c.id])
    );
    if (!active.length) return;

    const cfg   = active[active.length - 1];
    const size  = map.getSize();
    const bnds  = map.getBounds();
    const px    = map.latLngToContainerPoint(e.latlng);
    const sw    = bnds.getSouthWest();
    const ne    = bnds.getNorthEast();

    const qs = new URLSearchParams({
      SERVICE:      'WMS',
      VERSION:      '1.1.1',
      REQUEST:      'GetFeatureInfo',
      LAYERS:       cfg.layers,
      QUERY_LAYERS: cfg.layers,
      STYLES:       '',
      BBOX:         `${sw.lng},${sw.lat},${ne.lng},${ne.lat}`,
      WIDTH:        size.x,
      HEIGHT:       size.y,
      SRS:          'EPSG:4326',
      INFO_FORMAT:  'application/json',
      X:            Math.round(px.x),
      Y:            Math.round(px.y),
      FEATURE_COUNT: 5,
    });

    try {
      const res  = await fetch(`${cfg.url}?${qs}`, { signal: AbortSignal.timeout(6000) });
      const data = await res.json();
      if (data.features && data.features.length) {
        const props = data.features[0].properties || {};
        const entries = Object.entries(props).filter(([,v]) => v !== null && v !== '' && v !== undefined);
        if (!entries.length) return;
        ipBody.innerHTML = `<div style="font-size:9px;color:var(--text-lo);margin-bottom:6px;letter-spacing:.12em">${cfg.name.toUpperCase()}</div>` +
          entries.map(([k,v]) =>
            `<div class="ip-row"><div class="ip-k">${k.toLowerCase()}</div><div class="ip-v">${v}</div></div>`
          ).join('');
        ipPanel.classList.add('show');
      }
    } catch { /* CORS / timeout — silent fail */ }
  });

  </script>
</body>
